<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROYAL BENGAL | The Soul of Bengal on Every Plate | Kolkata</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* ============================================================
       BRAND DESIGN TOKENS & RESET
       ============================================================ */
    :root {
      --burgundy-900: #29060d;
      --burgundy-800: #420d18;
      --burgundy-700: #581220;
      --burgundy-600: #741b2c;
      --gold-500: #d4af37;
      --gold-600: #b89124;
      --gold-300: #f4e3a8;
      --gold-100: #fbf6e8;
      --ivory-50: #fdfcf7;
      --ivory-100: #f7f3e8;
      --ivory-200: #ece5d3;
      --charcoal: #1c1917;
      --gray-600: #57534e;
      --gray-400: #a8a29e;
      --veg-green: #15803d;
      --nonveg-red: #b91c1c;
      --shadow-sm: 0 2px 8px rgba(41, 6, 13, 0.06);
      --shadow-md: 0 8px 24px rgba(41, 6, 13, 0.12);
      --shadow-lg: 0 16px 40px rgba(41, 6, 13, 0.2);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--ivory-50);
      color: var(--charcoal);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .serif-font {
      font-family: 'Playfair Display', serif;
    }

    .display-font {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.08em;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ============================================================
       TOP ANNOUNCEMENT & NAVIGATION
       ============================================================ */
    .top-bar {
      background: var(--burgundy-900);
      color: var(--gold-300);
      font-size: 0.82rem;
      padding: 8px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }
    .top-bar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .top-bar-links span {
      margin-right: 18px;
    }
    .top-bar-links i {
      color: var(--gold-500);
      margin-right: 6px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 990;
      background: rgba(253, 252, 247, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--ivory-200);
      transition: var(--transition);
    }
    header.scrolled {
      box-shadow: var(--shadow-sm);
    }
    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-crest {
      width: 46px;
      height: 46px;
      background: var(--burgundy-800);
      border: 1.5px solid var(--gold-500);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-500);
      font-size: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .brand-title {
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--burgundy-800);
      line-height: 1;
      letter-spacing: 0.08em;
    }
    .brand-subtitle {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-600);
      margin-top: 3px;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--burgundy-800);
      transition: var(--transition);
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--gold-500);
      transition: var(--transition);
    }
    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cart-btn-trigger {
      position: relative;
      background: var(--ivory-100);
      border: 1px solid var(--gold-500);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--burgundy-800);
      transition: var(--transition);
    }
    .cart-btn-trigger:hover {
      background: var(--burgundy-800);
      color: var(--gold-300);
    }
    .cart-counter {
      background: var(--gold-500);
      color: var(--burgundy-900);
      font-size: 0.75rem;
      font-weight: 800;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-600) 100%);
      color: #fff;
      padding: 11px 24px;
      border-radius: 30px;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
      background: linear-gradient(135deg, #e0be4a 0%, var(--gold-600) 100%);
    }

    .btn-burgundy {
      background: var(--burgundy-800);
      color: var(--gold-100);
      border: 1px solid var(--gold-500);
      padding: 11px 24px;
      border-radius: 30px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-burgundy:hover {
      background: var(--burgundy-900);
      border-color: var(--gold-300);
      transform: translateY(-2px);
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--burgundy-800);
      cursor: pointer;
    }

    /* ============================================================
       HERO SECTION
       ============================================================ */
    .hero {
      position: relative;
      min-height: 85vh;
      background: linear-gradient(180deg, rgba(41, 6, 13, 0.78) 0%, rgba(41, 6, 13, 0.9) 100%),
                  url('https://images.unsplash.com/photo-1585937421612-70a008356fbe?auto=format&fit=crop&w=1600&q=85') center/cover no-repeat;
      display: flex;
      align-items: center;
      color: var(--ivory-50);
      padding: 80px 0;
    }
    .hero-content {
      max-width: 780px;
      margin: 0 auto;
      text-align: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 30px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold-300);
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .hero-title {
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 18px;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }
    .hero-title span {
      color: var(--gold-500);
      font-style: italic;
    }
    .hero-tagline {
      font-size: 1.35rem;
      font-weight: 300;
      color: var(--ivory-100);
      margin-bottom: 24px;
      letter-spacing: 0.05em;
      font-family: 'Playfair Display', serif;
    }
    .hero-desc {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 36px;
      line-height: 1.7;
    }
    .hero-cta {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .hero-pills {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      gap: 40px;
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      padding-top: 30px;
      flex-wrap: wrap;
    }
    .hero-pill-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ivory-100);
      font-size: 0.9rem;
    }
    .hero-pill-item i {
      color: var(--gold-500);
      font-size: 1.2rem;
    }

    /* ============================================================
       SECTION HEADINGS
       ============================================================ */
    .section-header {
      text-align: center;
      margin-bottom: 48px;
    }
    .section-eyebrow {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--gold-600);
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: clamp(2rem, 3.5vw, 2.75rem);
      color: var(--burgundy-800);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .section-divider {
      width: 70px;
      height: 3px;
      background: var(--gold-500);
      margin: 0 auto 16px;
      position: relative;
    }
    .section-divider::before, .section-divider::after {
      content: '◆';
      position: absolute;
      top: -9px;
      color: var(--gold-500);
      font-size: 12px;
    }
    .section-divider::before { left: -14px; }
    .section-divider::after { right: -14px; }
    .section-subtitle {
      color: var(--gray-600);
      max-width: 620px;
      margin: 0 auto;
      font-size: 1rem;
    }

    /* ============================================================
       FEATURED COMBOS / SPECIALS
       ============================================================ */
    .combos-section {
      padding: 90px 0;
      background: var(--ivory-100);
      position: relative;
    }
    .combo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }
    .combo-card {
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid var(--ivory-200);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .combo-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold-500);
    }
    .combo-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--burgundy-800);
      color: var(--gold-300);
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.08em;
      border: 1px solid var(--gold-500);
      z-index: 2;
    }
    .combo-img-wrapper {
      position: relative;
      height: 200px;
      overflow: hidden;
    }
    .combo-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .combo-card:hover .combo-img-wrapper img {
      transform: scale(1.08);
    }
    .combo-content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .combo-title {
      font-size: 1.3rem;
      color: var(--burgundy-800);
      margin-bottom: 6px;
    }
    .combo-desc {
      font-size: 0.88rem;
      color: var(--gray-600);
      margin-bottom: 20px;
      flex-grow: 1;
    }
    .combo-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed var(--ivory-200);
      padding-top: 16px;
    }
    .combo-price {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--burgundy-800);
      font-family: 'Playfair Display', serif;
    }

    /* ============================================================
       COMPLETE MENU SECTION
       ============================================================ */
    .menu-section {
      padding: 90px 0;
      background: var(--ivory-50);
    }
    
    .menu-controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .search-filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .menu-search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 480px;
    }
    .menu-search-box input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      border-radius: 30px;
      border: 1px solid var(--ivory-200);
      background: #ffffff;
      outline: none;
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .menu-search-box input:focus {
      border-color: var(--gold-500);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    .menu-search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
    }

    .dietary-filters {
      display: flex;
      gap: 10px;
    }
    .diet-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--ivory-200);
      background: #ffffff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      color: var(--gray-600);
    }
    .diet-btn.active {
      background: var(--burgundy-800);
      color: #ffffff;
      border-color: var(--burgundy-800);
    }

    .category-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
    }
    .category-tab {
      padding: 10px 22px;
      background: #ffffff;
      border: 1px solid var(--ivory-200);
      border-radius: 25px;
      white-space: nowrap;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--burgundy-800);
      cursor: pointer;
      transition: var(--transition);
    }
    .category-tab.active {
      background: var(--gold-500);
      color: var(--burgundy-900);
      border-color: var(--gold-500);
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }
    .category-tab:hover:not(.active) {
      border-color: var(--gold-500);
    }

    /* Menu Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 26px;
    }

    .menu-card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid rgba(236, 229, 211, 0.8);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }
    .menu-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-4px);
      border-color: var(--gold-500);
    }
    .menu-img-container {
      position: relative;
      height: 180px;
      width: 100%;
      overflow: hidden;
      background: var(--ivory-200);
    }
    .menu-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .menu-card:hover .menu-img-container img {
      transform: scale(1.06);
    }

    .food-mark {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px;
      border-radius: 4px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dot-box {
      width: 14px;
      height: 14px;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dot-box.veg {
      border-color: var(--veg-green);
    }
    .dot-box.nonveg {
      border-color: var(--nonveg-red);
    }
    .dot-box .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .dot-box.veg .dot {
      background-color: var(--veg-green);
    }
    .dot-box.nonveg .dot {
      background-color: var(--nonveg-red);
    }

    .bestseller-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--gold-500);
      color: var(--burgundy-900);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .menu-card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .menu-item-category {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold-600);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .menu-item-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--burgundy-800);
      margin-bottom: 6px;
    }
    .menu-item-desc {
      font-size: 0.83rem;
      color: var(--gray-600);
      margin-bottom: 18px;
      flex-grow: 1;
      line-height: 1.5;
    }

    .menu-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      border-top: 1px solid var(--ivory-200);
      padding-top: 14px;
    }
    .menu-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--burgundy-800);
      font-family: 'Playfair Display', serif;
    }

    .add-to-cart-btn {
      background: var(--burgundy-800);
      color: var(--gold-300);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .add-to-cart-btn:hover {
      background: var(--gold-500);
      color: var(--burgundy-900);
    }

    .qty-stepper {
      display: flex;
      align-items: center;
      background: var(--ivory-100);
      border: 1px solid var(--gold-500);
      border-radius: 20px;
      overflow: hidden;
    }
    .qty-btn {
      background: none;
      border: none;
      width: 30px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--burgundy-800);
      font-weight: bold;
      transition: var(--transition);
    }
    .qty-btn:hover {
      background: var(--gold-500);
      color: var(--burgundy-900);
    }
    .qty-val {
      padding: 0 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--burgundy-800);
      min-width: 24px;
      text-align: center;
    }

    /* ============================================================
       RESTAURANT STORY & HERITAGE
       ============================================================ */
    .story-section {
      padding: 100px 0;
      background: linear-gradient(135deg, var(--burgundy-900) 0%, var(--burgundy-800) 100%);
      color: #ffffff;
      position: relative;
    }
    .story-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .story-images {
      position: relative;
    }
    .story-img-main {
      border-radius: 12px;
      border: 2px solid var(--gold-500);
      box-shadow: var(--shadow-lg);
      width: 100%;
      height: 420px;
      object-fit: cover;
    }
    .story-badge-exp {
      position: absolute;
      bottom: -25px;
      right: -20px;
      background: var(--gold-500);
      color: var(--burgundy-900);
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }
    .story-badge-exp strong {
      display: block;
      font-size: 2rem;
      font-family: 'Playfair Display', serif;
      line-height: 1;
    }
    .story-badge-exp span {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .story-text .section-eyebrow {
      color: var(--gold-300);
    }
    .story-text h2 {
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      color: #ffffff;
      margin-bottom: 20px;
    }
    .story-text p {
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 20px;
      font-size: 1.02rem;
      line-height: 1.7;
    }
    .story-features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
    }
    .story-feature-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .story-feature-item i {
      color: var(--gold-500);
      font-size: 1.3rem;
      margin-top: 4px;
    }
    .story-feature-item h4 {
      color: var(--gold-300);
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .story-feature-item p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 0;
    }

    /* ============================================================
       CUSTOMER TESTIMONIALS
       ============================================================ */
    .reviews-section {
      padding: 90px 0;
      background: var(--ivory-50);
    }
    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }
    .review-card {
      background: #ffffff;
      border: 1px solid var(--ivory-200);
      border-radius: 12px;
      padding: 30px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .review-card::before {
      content: '“';
      position: absolute;
      top: 15px;
      right: 25px;
      font-size: 5rem;
      color: var(--ivory-200);
      font-family: 'Playfair Display', serif;
      line-height: 1;
      pointer-events: none;
    }
    .stars {
      color: var(--gold-500);
      margin-bottom: 14px;
      font-size: 0.95rem;
    }
    .review-text {
      font-size: 0.96rem;
      color: var(--gray-600);
      font-style: italic;
      margin-bottom: 22px;
      flex-grow: 1;
      line-height: 1.6;
    }
    .reviewer-meta {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .reviewer-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--burgundy-800);
      color: var(--gold-300);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      border: 1.5px solid var(--gold-500);
    }
    .reviewer-info h4 {
      font-size: 1rem;
      color: var(--burgundy-800);
    }
    .reviewer-info span {
      font-size: 0.8rem;
      color: var(--gray-400);
    }

    /* ============================================================
       CONTACT & LOCATION & INSTAGRAM
       ============================================================ */
    .info-section {
      padding: 80px 0;
      background: var(--ivory-100);
      border-top: 1px solid var(--ivory-200);
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
    }
    .info-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--ivory-200);
      text-align: center;
      transition: var(--transition);
    }
    .info-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold-500);
      box-shadow: var(--shadow-sm);
    }
    .info-icon-box {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--burgundy-800);
      color: var(--gold-500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      margin: 0 auto 16px;
    }
    .info-card h4 {
      color: var(--burgundy-800);
      font-size: 1.15rem;
      margin-bottom: 8px;
    }
    .info-card p {
      font-size: 0.9rem;
      color: var(--gray-600);
      line-height: 1.6;
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    footer {
      background: var(--burgundy-900);
      color: var(--ivory-100);
      padding: 60px 0 30px;
      border-top: 3px solid var(--gold-500);
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 50px;
      margin-bottom: 50px;
    }
    .footer-brand p {
      color: rgba(255, 255, 255, 0.7);
      margin-top: 16px;
      max-width: 380px;
      font-size: 0.92rem;
    }
    .footer-links h4 {
      color: var(--gold-500);
      font-size: 1.1rem;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }
    .footer-links ul {
      list-style: none;
    }
    .footer-links li {
      margin-bottom: 10px;
    }
    .footer-links a {
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.9rem;
      transition: var(--transition);
    }
    .footer-links a:hover {
      color: var(--gold-300);
      padding-left: 5px;
    }
    .social-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .social-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-300);
      transition: var(--transition);
    }
    .social-btn:hover {
      background: var(--gold-500);
      color: var(--burgundy-900);
      transform: translateY(-3px);
    }

    .footer-bottom {
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* ============================================================
       CART DRAWER / SLIDEOVER
       ============================================================ */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(41, 6, 13, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }
    .cart-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.25);
      z-index: 1001;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
    }
    .cart-drawer.open {
      transform: translateX(0);
    }

    .cart-header {
      padding: 20px 24px;
      background: var(--burgundy-800);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold-500);
    }
    .cart-header h3 {
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gold-300);
    }
    .cart-close-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.3rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .cart-close-btn:hover {
      color: var(--gold-500);
    }

    .cart-items-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-cart-state {
      text-align: center;
      margin: auto 0;
      padding: 40px 20px;
      color: var(--gray-600);
    }
    .empty-cart-state i {
      font-size: 3.5rem;
      color: var(--ivory-200);
      margin-bottom: 16px;
    }

    .cart-item-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: var(--ivory-50);
      border: 1px solid var(--ivory-200);
      border-radius: 8px;
    }
    .cart-item-thumb {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
    }
    .cart-item-details {
      flex: 1;
    }
    .cart-item-name {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--burgundy-800);
      margin-bottom: 2px;
    }
    .cart-item-unit-price {
      font-size: 0.8rem;
      color: var(--gray-600);
    }
    .cart-item-total {
      font-weight: 700;
      color: var(--burgundy-900);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .cart-footer {
      padding: 20px 24px;
      background: var(--ivory-100);
      border-top: 1px solid var(--ivory-200);
    }

    .cart-calc-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
      color: var(--gray-600);
      margin-bottom: 8px;
    }
    .cart-calc-row.total-row {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--burgundy-900);
      border-top: 1px dashed var(--gray-400);
      padding-top: 12px;
      margin-top: 10px;
    }
